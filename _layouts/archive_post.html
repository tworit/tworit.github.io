---
layout: default
---
<article class="post-shell">
  <p class="archive-note">From the archive · originally published {{ page.date | date: "%B %-d, %Y" }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.deck %}<p class="post-deck">{{ page.deck }}</p>{% endif %}
  <div class="post-body">{{ content }}</div>
  <a class="post-back" href="{{ '/archive/' | relative_url }}">← Back to the archive</a>
</article>
