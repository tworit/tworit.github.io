<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#07111f">
  <meta name="description" content="{{ site.description }}"><title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><a class="wordmark" href="{{ '/' | relative_url }}#top" aria-label="Tworit Dash, home"><span>∴</span> Tworit Dash</a><nav aria-label="Main navigation"><a href="{{ '/' | relative_url }}#research">Research</a><a href="{{ '/' | relative_url }}#publications">Publications</a><a href="{{ '/' | relative_url }}#software">Software</a><a href="{{ '/archive/' | relative_url }}">Archive</a></nav></header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer"><p><span class="prompt">Tworit Dash</span> · Model-based inference across signals and fields</p><p>© {{ 'now' | date: '%Y' }} · Built with Ruby + Jekyll</p></footer>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
